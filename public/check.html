<!DOCTYPE html>
<html lang="ru" style="background:#0a0a0f">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Nova — проверка связи</title>
<style>
  body { margin: 0; padding: calc(20px + env(safe-area-inset-top)) 16px 40px; background: #0a0a0f; color: #fff; font: 15px/1.45 -apple-system, system-ui, sans-serif; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p { color: rgba(255,255,255,.6); margin: 0 0 16px; font-size: 13px; }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 12px 14px; border-radius: 12px; background: rgba(255,255,255,.06); margin-bottom: 8px; }
  .row b { font-weight: 600; }
  .ok { color: #34d399; } .bad { color: #f87171; } .wait { color: #fbbf24; }
  button { width: 100%; margin-top: 10px; padding: 13px; border: 0; border-radius: 12px; background: #7c3aed; color: #fff; font: 600 15px -apple-system, sans-serif; }
  button.sec { background: rgba(255,255,255,.1); }
  pre { white-space: pre-wrap; word-break: break-word; font-size: 11px; color: rgba(255,255,255,.5); }
</style>
</head>
<body>
<h1>Проверка связи Nova</h1>
<p>Сделайте скриншот этой страницы через 30 секунд и отправьте разработчику.</p>
<div id="list"><div class="row"><b>Страница проверки</b><span class="ok">открылась</span></div></div>
<button id="reset">Сбросить данные Nova на этом телефоне</button>
<button class="sec" onclick="location.href='/'">Открыть Nova</button>
<pre id="info"></pre>
<script>
(function () {
  var list = document.getElementById("list");
  function row(name) {
    var d = document.createElement("div"); d.className = "row";
    d.innerHTML = "<b></b><span class='wait'>проверяю…</span>";
    d.firstChild.textContent = name; list.appendChild(d);
    return function (ok, text) { var s = d.lastChild; s.className = ok ? "ok" : "bad"; s.textContent = text; };
  }
  function test(name, url, opts) {
    var done = row(name), t0 = Date.now(), finished = false;
    var timer = setTimeout(function () { if (!finished) { finished = true; done(false, "нет ответа 20 с"); } }, 20000);
    fetch(url, Object.assign({ cache: "no-store" }, opts || {})).then(function (r) {
      if (finished) return; finished = true; clearTimeout(timer);
      done(true, "есть, " + ((Date.now() - t0) / 1000).toFixed(1) + " с");
    }).catch(function (e) {
      if (finished) return; finished = true; clearTimeout(timer);
      done(false, "ошибка: " + (e && e.message || e));
    });
  }
  test("Сайт novaa.pro", "/?check=" + Date.now());
  fetch("/?check2=" + Date.now(), { cache: "no-store" }).then(function (r) { return r.text(); }).then(function (html) {
    var m = html.match(/\/assets\/index-[^"]+\.js/);
    if (m) test("Файл приложения (1,2 МБ)", m[0]);
  }).catch(function () {});
  test("Сервер Nova (вход, чаты)", "https://functions.poehali.dev/3fc067b7-d1b3-4aed-8ad9-98df81040f0a?action=ping");
  test("Сервер файлов платформы", "https://cdn.poehali.dev/intertnal/js/route-min.js", { mode: "no-cors" });

  var sw = row("Служебный файл (кэш)");
  if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
    navigator.serviceWorker.getRegistrations().then(function (rs) { sw(true, rs.length ? "установлен: " + rs.length : "нет"); }).catch(function () { sw(true, "недоступен"); });
  } else sw(true, "не поддерживается");

  document.getElementById("info").textContent = navigator.userAgent + "\nonline: " + navigator.onLine +
    "\nярлык: " + (window.navigator.standalone ? "да" : "нет") + "\n" + new Date().toString();

  document.getElementById("reset").onclick = function () {
    var jobs = [];
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
    if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
    Promise.all(jobs).catch(function () {}).then(function () { alert("Готово. Откройте Nova заново."); location.href = "/?r=" + Date.now(); });
  };
})();
</script>
</body>
</html>
