      html, body { background: #0a0a0f; }
      #nova-splash {
        position: fixed; inset: 0; z-index: 2147483000;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
        background: radial-gradient(120% 80% at 50% 35%, #2a1450 0%, #120a24 45%, #0a0a0f 100%);
        transition: opacity .45s ease, visibility .45s ease;
        -webkit-user-select: none; user-select: none;
      }
      #nova-splash.hide { opacity: 0; visibility: hidden; }
      #nova-splash .ns-logo-wrap { position: relative; width: 112px; height: 112px; }
      #nova-splash .ns-glow {
        position: absolute; inset: -28px; border-radius: 50%;
        background: radial-gradient(circle, rgba(124,58,237,.55) 0%, rgba(236,72,153,.25) 45%, transparent 70%);
        filter: blur(6px); animation: ns-pulse 2.2s ease-in-out infinite;
      }
      #nova-splash .ns-logo {
        position: relative; width: 112px; height: 112px; border-radius: 28px;
        box-shadow: 0 18px 50px rgba(124,58,237,.45);
        animation: ns-pop .7s cubic-bezier(.2,.9,.3,1.3) both, ns-float 3s ease-in-out .7s infinite;
      }
      #nova-splash .ns-title {
        font: 700 26px/1 -apple-system, "Golos Text", system-ui, sans-serif; letter-spacing: .32em;
        color: #fff; margin-right: -.32em; animation: ns-fade .6s ease .25s both;
      }
      #nova-splash .ns-bar {
        width: 140px; height: 4px; border-radius: 4px; overflow: hidden;
        background: rgba(255,255,255,.1); animation: ns-fade .6s ease .4s both;
      }
      #nova-splash .ns-bar i {
        display: block; width: 40%; height: 100%; border-radius: 4px;
        background: linear-gradient(90deg, #ec4899, #7c3aed, #22d3ee);
        animation: ns-slide 1.2s ease-in-out infinite;
      }
      #nova-splash .ns-hint {
        position: absolute; bottom: calc(36px + env(safe-area-inset-bottom)); left: 0; right: 0; text-align: center;
        font: 500 13px -apple-system, system-ui, sans-serif; color: rgba(255,255,255,.45);
        opacity: 0; transition: opacity .4s ease;
      }
      #nova-splash.slow .ns-hint { opacity: 1; }
      @keyframes ns-pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
      @keyframes ns-float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
      @keyframes ns-pulse { 0%,100% { transform: scale(.9); opacity: .7; } 50% { transform: scale(1.08); opacity: 1; } }
      @keyframes ns-fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      @keyframes ns-slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) {
        #nova-splash * { animation-duration: .01s !important; animation-iteration-count: 1 !important; }
      }

<div id="nova-splash" aria-label="Nova загружается" role="status">
  <div class="ns-logo-wrap">
    <div class="ns-glow"></div>
    <img class="ns-logo" src="/splash-logo.webp" alt="Nova" width="112" height="112" decoding="async" fetchpriority="high">

  <div class="ns-title">NOVA</div>

  <div class="ns-hint">Загружаем Nova…<button type="button" id="ns-reset" style="display:none;margin:12px auto 0;padding:10px 18px;border:1px solid rgba(255,255,255,.25);border-radius:12px;background:transparent;color:#fff;font:600 14px -apple-system,sans-serif">Перезапустить</button></div>
</div>
<div id="root"></div>
<script>
  (function () {
    var splash = document.getElementById("nova-splash");
    var start = Date.now();
    var done = false;
    function hideSplash() {
      if (done || !splash) return;
      done = true;
      var wait = Math.max(0, 600 - (Date.now() - start));
      setTimeout(function () {
        splash.classList.add("hide");
        setTimeout(function () { if (splash.parentNode) splash.parentNode.removeChild(splash); }, 500);
      }, wait);
    }
    window.__novaHideSplash = hideSplash;
    var root = document.getElementById("root");
    if (window.MutationObserver && root) {
      var mo = new MutationObserver(function () {
        if (root.children.length) { mo.disconnect(); requestAnimationFrame(function () { requestAnimationFrame(hideSplash); }); }
      });
      mo.observe(root, { childList: true });
    }
    setTimeout(function () { if (splash && !done) splash.classList.add("slow"); }, 4000);
    setTimeout(function () {
      var b = document.getElementById("ns-reset");
      if (!b || done) return;
      b.style.display = "block";
      b.onclick = function () { if (window.__novaResetApp) window.__novaResetApp(); else location.reload(); };
    }, 10000);
    setTimeout(hideSplash, 20000);
  })();
</script>
<script>
  (function () {
    var errs = [];
    function show(title) {
      if (window.__novaHideSplash) window.__novaHideSplash();
      var box = document.getElementById("nova-boot-error");
      if (!box) {
        box = document.createElement("div");
        box.id = "nova-boot-error";
        box.style.cssText = "position:fixed;left:0;right:0;bottom:0;z-index:2147483647;max-height:60vh;overflow:auto;background:#fff;color:#111;font:13px/1.45 -apple-system,sans-serif;padding:16px 16px calc(16px + env(safe-area-inset-bottom));border-top:3px solid #e11d48;white-space:pre-wrap;word-break:break-word";
        document.body.appendChild(box);
      }
      box.textContent = title + "\n\n" + errs.slice(-5).join("\n\n") + "\n\n" + navigator.userAgent + "\n\nСделайте скриншот и отправьте разработчику.\n\n";
      var btn = document.createElement("button");
      btn.textContent = "Очистить кэш и перезапустить";
      btn.style.cssText = "display:block;width:100%;padding:12px;border:0;border-radius:10px;background:#7c3aed;color:#fff;font:600 15px -apple-system,sans-serif";
      btn.onclick = resetApp;
      box.appendChild(btn);
    }
    window.__novaResetApp = function () { resetApp(); };
    function resetApp() {
      var jobs = [];
      if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
        jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
          return Promise.all(rs.map(function (r) { return r.unregister(); }));
        }));
      }
      if (window.caches && caches.keys) {
        jobs.push(caches.keys().then(function (ks) {
          return Promise.all(ks.filter(function (k) { return k !== "nova-auth"; }).map(function (k) { return caches.delete(k); }));
        }));
      }
      Promise.all(jobs).catch(function () {}).then(function () { location.replace("/?r=" + Date.now()); });
    }
    window.addEventListener("error", function (e) {
      var t = e.target;
      if (t && t !== window && t.tagName !== "SCRIPT" && t.tagName !== "LINK") return;
      var src = (t && t !== window && (t.src || t.href)) || e.filename || "";
      if (src && src.indexOf(location.origin) !== 0) return;
      if (!src && (!e.message || e.message === "Script error.")) return;
      var where = e.filename ? " (" + String(e.filename).split("/").pop() + ":" + e.lineno + ":" + e.colno + ")" : "";
      errs.push("Ошибка: " + (e.message || (e.target && (e.target.src || e.target.href)) || "загрузка файла") + where);
      show("Nova не запустилась");
    }, true);
    window.addEventListener("unhandledrejection", function (e) {
      var r = e.reason;
      errs.push("Ошибка: " + (r && (r.stack || r.message) || String(r)));
    });
    setTimeout(function () {
      var root = document.getElementById("root");
      if (root && !root.children.length) show("Nova не запустилась за 8 секунд");
    }, 8000);
  })();
</script>
<noscript>
    <div style="max-width:720px;margin:0 auto;padding:24px;font-family:sans-serif;color:#111;line-height:1.6">
        <h1>Nova — мессенджер для общения</h1>
        <h2>Политика конфиденциальности</h2>
        <p>Nova — мессенджер для приватного общения (личные и групповые чаты, звонки, фото, видео и голосовые сообщения). Приложение обрабатывает персональные данные в соответствии с Федеральным законом № 152-ФЗ «О персональных данных».</p>
        <p><strong>Регистрация и вход:</strong> по номеру мобильного телефона и имени. Пароль и SMS-код не используются.</p>
        <p><strong>Собираемые данные:</strong> номер телефона, имя, аватар, «О себе», пол и дата рождения (по желанию); содержимое переписки (сообщения, фото, видео, аудио, документы, голосовые и видео-кружки, стикеры, реакции); служебные данные звонков; список контактов (с согласия); push-токен устройства; IP-адрес и данные об устройстве; данные о платежах (через ЮKassA; реквизиты карт не хранятся).</p>
        <p><strong>Хранение:</strong> на серверах в Российской Федерации, передача защищена TLS 1.2+.</p>
        <p><strong>Передача третьим лицам:</strong> только платёжному сервису ЮKassA, сервису push-уведомлений FCM (обезличенный токен) и уполномоченным госорганам по законным запросам. В рекламных целях данные не передаются.</p>
        <p><strong>Права пользователя:</strong> удаление аккаунта и данных прямо в приложении (Настройки → Аккаунт → Удалить аккаунт), отзыв согласия, обращение в Роскомнадзор.</p>
        <p>Полный текст: <a href="/privacy">novaa.pro/privacy</a></p>
    </div>
</noscript>
